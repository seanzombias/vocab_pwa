<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="description" content="每日英文词汇、短语与原句同步">
  <title>英文词汇本</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>英文词汇本</h1>
      <p id="statusText">加载中...</p>
    </div>
    <button id="exportBtn" class="ghost-btn" type="button">导出 Anki</button>
  </header>

  <nav class="tabs" aria-label="主导航">
    <button class="tab active" data-tab="today" type="button">今日</button>
    <button class="tab" data-tab="browse" type="button">浏览</button>
    <button class="tab" data-tab="add" type="button">添加</button>
  </nav>

  <main>
    <section id="panel-today" class="panel active">
      <div id="todayList" class="card-list"></div>
    </section>

    <section id="panel-browse" class="panel">
      <div class="filters">
        <input id="searchInput" type="search" placeholder="搜索词汇、短语、释义、原句">
        <div class="filter-row">
          <select id="dateFilter">
            <option value="">全部日期</option>
          </select>
          <select id="tagFilter">
            <option value="">全部标签</option>
          </select>
        </div>
      </div>
      <div id="browseList" class="card-list"></div>
    </section>

    <section id="panel-add" class="panel">
      <form id="addForm" class="add-form">
        <label>
          关键词汇 *
          <input name="word" required autocomplete="off">
        </label>
        <label>
          短语
          <input name="phrase" autocomplete="off">
        </label>
        <label>
          释义 *
          <textarea name="meaning" rows="3" required></textarea>
        </label>
        <label>
          原句 *
          <textarea name="sentence" rows="4" required></textarea>
        </label>
        <label>
          来源
          <input name="source" autocomplete="off">
        </label>
        <label>
          标签（逗号分隔）
          <input name="tags" placeholder="politics, verb" autocomplete="off">
        </label>
        <label>
          API Token
          <input name="token" type="password" placeholder="保存在本机，不会上传到其他地址">
        </label>
        <button type="submit" class="primary-btn">保存词汇</button>
        <p id="formMessage" class="form-message"></p>
      </form>
    </section>
  </main>

  <template id="cardTemplate">
    <article class="vocab-card">
      <div class="card-head">
        <h2 class="word"></h2>
        <span class="date"></span>
      </div>
      <p class="phrase"></p>
      <p class="meaning"></p>
      <blockquote class="sentence"></blockquote>
      <p class="source"></p>
      <div class="tags"></div>
      <div class="card-actions">
        <button type="button" class="action-btn copy-btn">复制</button>
        <button type="button" class="action-btn speak-btn">朗读</button>
      </div>
    </article>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
