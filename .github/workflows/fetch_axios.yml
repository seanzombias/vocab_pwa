name: Fetch Axios News

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and extract Axios articles
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openrouter/free
          VOCAB_API_TOKEN: ${{ secrets.VOCAB_API_TOKEN }}
        run: |
          python scripts/fetch_axios_news.py --max-items 5 --import --api https://vocab-pwa-api.756121162.workers.dev

      - name: Commit fetched articles and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/axios_articles backend/data/axios_fetched_state.json
          if git diff --staged --quiet; then
            echo "No new articles to commit."
          else
            git commit -m "chore: fetch Axios news articles"
            git push
          fi
